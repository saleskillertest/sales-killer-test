<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#12140F; --panel:#1A1D16; --panel2:#20241B; --edge:#2C3125; --txt:#F4F5F0; --dim:#8F958A;
    --rosso:#E0453C; --giallo:#E9A227; --verde:#3FA46A; --blu:#4478E0;
    --serif:"Instrument Serif",Georgia,serif;
    --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 500px at 15% -10%, rgba(224,69,60,.10), transparent 60%),
               radial-gradient(700px 450px at 90% 5%, rgba(68,120,224,.10), transparent 60%)}
  .colorbar{display:flex;height:3px;position:sticky;top:0;z-index:9;background:var(--edge)}
  .colorbar i{transition:flex .45s cubic-bezier(.2,.8,.2,1)}
  .cb-r{background:var(--rosso)} .cb-g{background:var(--giallo)}
  .cb-v{background:var(--verde)} .cb-b{background:var(--blu)}
  .cb-rest{background:var(--edge)}
  .cb-done{background:var(--txt)}
  .wrap{display:flex;justify-content:center;padding:40px 22px 22px;position:relative;z-index:1}
  .card{width:100%;max-width:640px}
  .fade{animation:fade .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--edge);border-radius:100px;padding:7px 14px;margin-bottom:30px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--rosso);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  h1{font-family:var(--serif);font-size:clamp(42px,11vw,68px);line-height:1;font-weight:400;letter-spacing:-.02em}
  h1 .soft{color:var(--dim);font-style:italic}
  .lede{color:var(--dim);font-size:17px;line-height:1.65;margin-top:24px;max-width:33em}
  .stats{display:flex;gap:0;margin-top:38px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
  .stat{flex:1;padding:22px 16px;border-right:1px solid var(--edge)}
  .stat:first-child{padding-left:0}
  .stat:last-child{padding-right:0}
  .stat:last-child{border-right:none}
  .stat b{display:block;font-family:var(--serif);font-size:36px;font-weight:400;line-height:1}
  .stat span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:9px}

  .qhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .qnum{font-family:var(--serif);font-size:34px;line-height:1;color:var(--dim)}
  .qtot{font-size:11.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  h2{font-family:var(--serif);font-size:clamp(26px,6.5vw,36px);line-height:1.16;font-weight:400;letter-spacing:-.01em}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:26px}
  .opt{position:relative;text-align:left;font:inherit;font-size:16px;line-height:1.5;padding:17px 18px 17px 20px;
    border:1px solid var(--edge);border-radius:14px;background:var(--panel);color:var(--txt);cursor:pointer;
    transition:border-color .16s,background .16s,transform .1s}
  .opt::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:transparent;transition:background .16s}
  .opt:hover{border-color:#454B3D;background:var(--panel2)}
  .opt:active{transform:scale(.995)}
  .opt.sel{border-color:var(--txt);background:var(--panel2)}
  .opt.sel::before{background:var(--txt)}
  .opt:focus-visible{outline:2px solid var(--txt);outline-offset:2px}

  input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:17px;padding:16px 18px;border:1px solid var(--edge);border-radius:13px;background:var(--panel);color:var(--txt);outline:none;margin-top:30px;transition:border-color .16s}
  input::placeholder{color:#666C60}
  input:focus{border-color:var(--txt)}
  .campi input{margin-top:12px}
  .campi input:first-child{margin-top:30px}
  .privacy{color:var(--dim);font-size:13px;margin-top:14px;line-height:1.5}
  .consenso{display:flex;gap:12px;align-items:flex-start;margin-top:18px;color:var(--dim);font-size:14px;line-height:1.5;cursor:pointer}
  .consenso input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--txt)}

  .nav{position:relative;background:transparent;padding:4px 22px 40px;display:flex;justify-content:center;z-index:1}
  .navin{width:100%;max-width:640px;display:flex;gap:10px}
  .btn{font:inherit;font-size:16.5px;font-weight:600;padding:17px 28px;border-radius:13px;border:none;cursor:pointer;background:var(--txt);color:var(--bg);flex:1;transition:opacity .15s,transform .1s}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:transparent;color:var(--dim);flex:0 0 auto;border:1px solid var(--edge)}
  .err{color:var(--rosso);font-size:14px;margin-top:16px;display:none}

  .gate{text-align:center;padding-top:24px}
  .lockmix{display:flex;gap:5px;justify-content:center;margin-bottom:30px}
  .lockmix i{width:38px;height:6px;border-radius:3px;opacity:.4;animation:rise .5s backwards}
  .lockmix i:nth-child(2){animation-delay:.08s}.lockmix i:nth-child(3){animation-delay:.16s}.lockmix i:nth-child(4){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:.4;transform:none}}
  .gate h2{margin-bottom:16px}
  .gate p{color:var(--dim);font-size:16px;line-height:1.65;max-width:30em;margin:0 auto}
  .gatebtns{display:flex;flex-direction:column;gap:11px;margin-top:34px}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:16.5px;font-weight:600;padding:18px;border-radius:13px;border:none;cursor:pointer;color:#fff;transition:filter .15s,transform .1s}
  .gbtn:hover{filter:brightness(1.08)} .gbtn:active{transform:scale(.99)}
  .gsend{background:var(--txt);color:var(--bg)}
  .gback{background:transparent;color:var(--dim);border:1px solid var(--edge)}
  .gbtn:disabled{opacity:.55;cursor:default;filter:none;transform:none}
  .gate p b{color:var(--txt);font-weight:600}
  .gnote{font-size:13px;color:var(--dim);margin-top:22px;line-height:1.55;max-width:28em;margin-left:auto;margin-right:auto}

</style>
</head>

 {q:"Chiamata a freddo: come apri i primi 20 secondi?", o:[
  {c:"R",t:"Dritto al punto: chi sono, che risultato porto, quanto tempo mi serve."},

  {c:"B",t:"Apro con un riferimento preciso alla sua azienda: dimostro che ho studiato."}]},
 {q:"Il cliente dice: \u201Ccosta troppo\u201D. Prima mossa?", o:[
  {c:"R",t:"Ribalto: quanto gli costa NON risolvere il problema? Torno sul risultato."},

const REPORTS={
 R:{stile:"Comunicatore diretto e orientato al risultato. Al telefono va dritto al punto: poco riscaldamento, ritmo alto, domande che portano a una decisione. Le sue leve naturali sono urgenza, risultato e sfida; le obiezioni le affronta frontalmente, spesso ribaltandole sul costo del non agire. Chiude presto e chiede l'ordine senza esitazioni. Il rovescio della medaglia: può ascoltare poco, saltare la fase di scoperta e mettere pressione a clienti che avevano solo bisogno di un passaggio in più, bruciando trattative che erano vive.",
   manager:"Comunicagli in modo diretto e sintetico: niente giri di parole, niente micro-gestione. Dagli obiettivi sfidanti, classifiche e gare: si accende con la competizione e con incentivi legati alla performance. Riconoscigli i risultati in modo esplicito. Nei confronti evita lo scontro di potere frontale: presenta i fatti e lascia che la decisione sembri anche sua. Se devi correggerlo, fallo su numeri e comportamenti specifici, mai sulla persona.",
   piano:"È già il profilo di chiusura: il piano è di affinamento, non di trasformazione. 1) Ascolto attivo: nelle prossime 20 chiamate, due domande di scoperta in più prima di proporre. 2) Regola del respiro: dopo l'obiezione, una pausa e una riformulazione prima di controbattere. 3) Trattative lunghe: coltivare i cicli complessi senza forzare la chiusura al primo contatto. 4) Riascoltare una chiamata a settimana contando quanto parla lui rispetto al cliente: obiettivo sotto il 50%."},
 G:{stile:"Comunicatore espressivo e relazionale. Al telefono è caldo, coinvolgente, trascinante: crea sintonia in pochi minuti e usa storie e casi concreti come leva principale, insieme all'emozione e alla prova sociale. Le obiezioni le smonta con leggerezza e ottimismo. Il rovescio della medaglia: può disperdersi nella conversazione, perdere la struttura della trattativa, trascurare follow-up e CRM, e arrivare a fine chiamata con un ottimo clima ma senza una chiusura o un prossimo passo definito.",
   manager:"Motivalo con riconoscimento visibile: complimenti davanti al team, premi, gare con celebrazione. Comunicagli con energia: un manager piatto lo spegne. Il suo punto debole è la struttura, non la motivazione: aiutalo con processi semplici e non negoziabili (CRM aggiornato, follow-up calendarizzati) presentandoli come strumenti per vincere, non come burocrazia. Nelle riunioni dagli spazio per parlare, ma chiudi sempre tu con azioni concrete e scadenze.",
   piano:"Obiettivo: incanalare l'energia verso la chiusura. 1) Ogni chiamata parte con un obiettivo scritto: che decisione voglio ottenere oggi? 2) Script di chiusura fisso: tre formule per chiedere l'ordine, da usare a ogni trattativa matura. L'entusiasmo apre, la domanda chiude. 3) Disciplina dei numeri: monitorare conversione e tentativi di chiusura a settimana, non solo relazioni avviate. 4) Follow-up entro 24 ore, sempre, con proposta e data. 5) Allenare la tolleranza al momento di tensione: chiedere e stare in silenzio."},
 V:{stile:"Comunicatore empatico e cooperativo. Al telefono ha tono calmo, ascolta davvero, fa domande e costruisce una fiducia che dura: i clienti si aprono con lui e restano. Le sue leve sono rassicurazione, presenza e assenza di rischio; le obiezioni le accoglie prima di rispondere. Il rovescio della medaglia: evita il conflitto e la pressione, quindi rimanda la richiesta d'ordine, concede troppo facilmente sul prezzo e può accompagnare a lungo trattative che non decide mai di chiudere.",
   manager:"Comunicagli con calma e in privato: la pressione pubblica lo blocca, la sicurezza lo sblocca. Dagli stabilità, feedback costruttivo e obiettivi graduali; riconosci la qualità della relazione che costruisce, perché è reale valore commerciale. Non chiedergli di essere più aggressivo: dagli invece un metodo di chiusura passo-passo da seguire, e affiancalo nei role-play. Incentivi: più efficaci quelli legati alla continuità e al team che le gare individuali spinte.",
   piano:"Obiettivo: trasformare la fiducia che crea in decisioni. 1) Reframe: chiudere non è forzare, è aiutare il cliente a decidere. Lasciarlo nell'indecisione non è gentilezza. 2) Una frase di chiusura pronta e provata ad alta voce, da usare a ogni trattativa matura. 3) Allenare il silenzio dopo la richiesta: chiedere l'ordine e non riempire la pausa. 4) Role-play settimanale sull'obiezione prezzo: tenere il punto senza concedere subito. 5) KPI personale: numero di richieste d'ordine fatte a settimana."},
 B:{stile:"Comunicatore analitico e strutturato. Al telefono è preparato, preciso, credibile: conosce il prodotto meglio di chiunque, segue una scaletta, risponde alle obiezioni con dati, confronti e documentazione. Le sue leve sono numeri, prove e logica. Il rovescio della medaglia: può diventare troppo tecnico e perdere il cliente nei dettagli, aspettare di avere tutte le informazioni prima di spingere, e non chiedere mai davvero l'ordine perché la trattativa non gli sembra mai perfettamente matura.",
   manager:"Comunicagli con fatti, non con slogan motivazionali: vuole capire il perché delle richieste. Dagli tempo di preparazione e dati di qualità; feedback specifico e documentato, mai generico. Non forzarlo a improvvisare in pubblico. Fissagli scadenze decisionali esplicite, perché la sua tendenza è rimandare in nome dell'analisi. Incentivi: obiettivi chiari e misurabili, con regole del gioco trasparenti.",
   piano:"Obiettivo: passare dall'analisi all'azione. 1) Regola dei 3 benefici: ogni presentazione parte da tre benefici in linguaggio semplice, i dettagli tecnici solo se richiesti. 2) Deadline di chiusura: ogni trattativa ha una data entro cui chiedere l'ordine, anche con informazioni incomplete. L'80% di preparazione basta. 3) Call to action obbligatoria: nessuna chiamata o email si chiude senza un prossimo passo con data. 4) Allenare l'urgenza: dare al cliente una ragione vera per decidere ora. 5) Accettare il rifiuto come dato: un no veloce vale più di un forse eterno."}};

let step=-1, userName="", userMail="", userTel="", inviato=false, consenso=false;
// Chi arriva dalla pubblicita' ha ?src=meta nel link dell'inserzione.
const DA_PUBBLICITA = new URLSearchParams(location.search).get('src') === 'meta';
// Pixel dell'account Eticavende ("100K - 1M BUSINESS TARGET").
const PIXEL_ID = "1331943178920646";

// Il pixel parte solo per chi arriva dalla pubblicita' e dopo il consenso.
// Email e telefono vanno a Meta gia' cifrati dal pixel stesso (corrispondenza
// avanzata): aiutano Meta a riconoscere chi completa e a cercarne di simili.
function caricaPixel(){
  if(!DA_PUBBLICITA || window.fbq) return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  let tel=userTel.replace(/\D/g,'');
  if(tel && !tel.startsWith('39') && tel.length<=10) tel='39'+tel;
  fbq('init', PIXEL_ID, {em:userMail.toLowerCase(), ph:tel});
  fbq('track','PageView');
}
// Non "Lead": su questo pixel Meta lo tiene in restrictedEventNames e lo
// scarta senza dirlo (settembre 2026, nessun Lead arrivato su 2 test veri).
// CompleteRegistration non e' ristretto ed e' quello su cui ottimizza la campagna.
function segnalaLead(){ if(DA_PUBBLICITA && window.fbq) fbq('track','CompleteRegistration'); }
const answers=new Array(QUESTIONS.length).fill(null);
const shuffled=QUESTIONS.map(q=>{const o=[...q.o];for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return{q:q.q,n:q.n,o};});
const app=document.getElementById('app'),next=document.getElementById('next'),back=document.getElementById('back'),cbar=document.getElementById('cbar'),nav=document.querySelector('.nav');
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const COLORATE=QUESTIONS.filter(q=>!q.n).length;   // le domande che fanno punteggio
function scelta(i){const a=answers[i];return a==null?null:shuffled[i].o[a];}   // l'opzione premuta
function codice(i){const o=scelta(i);return o?o.c:null;}
function counts(){const c={R:0,G:0,V:0,B:0};answers.forEach((a,i)=>{const k=codice(i);if(k&&c.hasOwnProperty(k))c[k]++});return c}
function ranking(){const c=counts(),t=COLORATE;const a=Object.keys(c).map(k=>({k,n:c[k],p:Math.round(c[k]/t*100)}));a.sort((x,y)=>y.n-x.n);return a}
function updateBar(){const d=answers.filter(a=>a!=null).length,t=QUESTIONS.length;
  cbar.innerHTML=`<i class="cb-done" style="flex:${d}"></i><i class="cb-rest" style="flex:${t-d}"></i>`}

function render(){
  if(step>QUESTIONS.length) step=QUESTIONS.length;   // niente indici fuori range
  if(step<-1) step=-1;
  updateBar();
  back.style.visibility=step<=-1?'hidden':'visible';
  nav.style.display='flex';
  if(step===-1){
    next.textContent='Inizia il test';
    app.innerHTML=`<div class="fade"><div class="eyebrow"><span class="dot"></span>Assessment comportamentale</div>
      <h1>Non vendi male.<br><span class="soft">Vendi a modo tuo.</span></h1>
      <p class="lede">Il test fotografa come reagisci quando la conversazione si fa vera: pressione, prezzo, silenzi e decisioni. Rispondi d'istinto, come fai davvero, non come si dovrebbe. Alla fine ricevi un riscontro personale sul tuo stile di vendita da Rocco Resta.</p>
      <div class="stats">
        <div class="stat"><b>22</b><span>scenari reali</span></div>
        <div class="stat"><b>4</b><span>stili</span></div>
        <div class="stat"><b>5'</b><span>durata</span></div>
      </div>
      <div class="campi">
        <input type="text" id="uname" placeholder="Nome e cognome" value="${esc(userName)}" autocomplete="name">
        <input type="email" id="umail" placeholder="Email" value="${esc(userMail)}" autocomplete="email" inputmode="email">
        <input type="tel" id="utel" placeholder="Telefono" value="${esc(userTel)}" autocomplete="tel" inputmode="tel">
      </div>
      <p class="err" id="err">Compila nome, email e telefono per iniziare.</p>
      ${DA_PUBBLICITA
        ? `<label class="consenso"><input type="checkbox" id="ucons" ${consenso?'checked':''}><span>Acconsento a essere ricontattato da Rocco Resta per il riscontro sul test, e all'uso dei miei dati per misurare la pubblicità su Meta.</span></label>`
        : `<p class="privacy">Servono a Rocco Resta per mandarti il riscontro sul tuo stile di vendita.</p>`}</div>`;
    return;
  }
  if(step===QUESTIONS.length){ inviato?renderGrazie():renderInvio(); return; }
  const q=shuffled[step];
  next.textContent=step===QUESTIONS.length-1?'Concludi':'Avanti';
  app.innerHTML=`<div class="fade">
    <div class="qhead"><span class="qnum">${String(step+1).padStart(2,'0')}</span><span class="qtot">di ${QUESTIONS.length}</span></div>
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.o.map((o,idx)=>`<button type="button" class="opt ${answers[step]===idx?'sel':''}" data-i="${idx}" onclick="choose(this)">${esc(o.t)}</button>`).join('')}</div>
    <p class="err" id="err">Scegli una risposta per continuare.</p></div>`;
  window.scrollTo({top:0});
}
function choose(el){answers[step]=Number(el.dataset.i);document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');updateBar();setTimeout(()=>{step++;render()},170)}

function nomeProprio(){return esc(userName.split(/\s+/)[0]||userName);}

function renderInvio(){
  nav.style.display='none';
  app.innerHTML=`<div class="gate fade">
    <div class="lockmix"><i style="background:var(--rosso)"></i><i style="background:var(--giallo)"></i><i style="background:var(--verde)"></i><i style="background:var(--blu)"></i></div>
    <h2>Hai finito, ${nomeProprio()}.</h2>
    <p>${DA_PUBBLICITA
      ? "Premi <b>Invia</b>: le tue risposte arrivano a Rocco Resta, che ti ricontatta con il riscontro sul tuo stile e su cosa allenare."
      : "Premi <b>Invia</b>: le tue risposte arrivano a Rocco Resta, che ti darà un riscontro sul tuo stile e su cosa allenare."}</p>
    <div class="gatebtns">
      <button class="gbtn gsend" id="btnInvia" onclick="invia()">Invia</button>
      <button class="gbtn gback" id="btnRivedi" onclick="step--;render()">Rivedi le risposte</button>
    </div>
    <p class="gnote" id="inviostat" role="status"></p>
  </div>`;
  window.scrollTo({top:0});
}

function renderGrazie(){
  nav.style.display='none';
  app.innerHTML=`<div class="gate fade">
    <div class="lockmix"><i style="background:var(--rosso)"></i><i style="background:var(--giallo)"></i><i style="background:var(--verde)"></i><i style="background:var(--blu)"></i></div>
    <h2>Test inviato.</h2>
    <p>Grazie ${nomeProprio()}. ${DA_PUBBLICITA
      ? "Le tue risposte sono arrivate a Rocco Resta, che ti ricontatterà per il riscontro. Puoi chiudere questa pagina."
      : "Le tue risposte sono arrivate a Rocco Resta, che ti darà un riscontro. Puoi chiudere questa pagina."}</p>
  </div>`;
  window.scrollTo({top:0});
}

// le domande neutre servono al sales manager per tarare la mentalita':
// le mandiamo anche separate, non solo dentro il testo delle risposte
function estratteNeutre(){
  return shuffled.map((q,i)=>{
    if(!q.n) return null;
    const o=scelta(i);
    return o?o.t:"";
  }).filter(x=>x!==null).join(" ||| ");
}

function payload(){
  const rk=ranking(), dom=rk[0];
  return {
    nome:DA_PUBBLICITA?`${userName} (da pubblicità)`:userName,
    email:userMail,
    telefono:userTel,
    profilo:`${COLORS[dom.k].name} (${COLORS[dom.k].tag})`,
    mix:rk.map(r=>`${COLORS[r.k].name} ${r.p}%`).join(' | '),
    risposte:shuffled.map((q,i)=>{const o=scelta(i),c=codice(i);
      return `${i+1}. ${q.q} -> ${c&&COLORS[c]?`[${COLORS[c].name}] `:""}${o?o.t:"(nessuna risposta)"}`}).join("\n"),
    report:fullReport(),
    extra:estratteNeutre()
  };
}
// Due canali in parallelo: il foglio (sempre) e l'email a Rocco.
// Basta che uno dei due parta per considerare il test consegnato.
let inCorso=false;
async function invia(){
  if(inCorso||inviato) return;
  inCorso=true;
  const btn=document.getElementById('btnInvia'), riv=document.getElementById('btnRivedi'), stat=document.getElementById('inviostat');
  btn.disabled=true; riv.disabled=true; btn.textContent='Invio in corso…'; stat.textContent='';
  const [foglio,email]=await Promise.all([inviaFoglio(),inviaEmail()]);
  inCorso=false;
  if(foglio||email){ inviato=true; segnalaLead(); render(); return; }
  btn.disabled=false; riv.disabled=false; btn.textContent='Riprova';
  stat.textContent='Invio non riuscito: controlla la connessione e riprova.';
}

function inviaFoglio(){
  if(!ENDPOINT) return Promise.resolve(false);
  // no-cors: la risposta non è leggibile, si sa solo che la richiesta è partita
  return fetch(ENDPOINT,{method:'POST',mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams(payload()).toString()})
    .then(()=>true).catch(()=>false);
}

function inviaEmail(){
  if(!EMAIL_ROCCO) return Promise.resolve(false);
  const p=payload(), neutre=p.extra.split(' ||| ');
  return fetch('https://formsubmit.co/ajax/'+EMAIL_ROCCO,{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({
      _subject:`Sales Killer Test — ${DA_PUBBLICITA?'NUOVO CONTATTO da pubblicità — '+userName:p.nome} — ${p.profilo}`,
      _template:'box',
      Venditore:p.nome,
      Email:p.email,
      Telefono:p.telefono,
      _replyto:p.email,
      Profilo:p.profilo,
      Mix:p.mix,
      'Domanda del milione':neutre[0]||'',
      'Domanda del premio':neutre[1]||'',
      Report:p.report
    })
  })
    .then(r=>r.json())
    .then(j=>{ if(String(j.success)!=='true') console.warn('FormSubmit:',j.message); return String(j.success)==='true'; })
    .catch(()=>false);
}

function fullReport(){
  const rk=ranking(),dom=rk[0],R=REPORTS[dom.k];
  const L=["SALES KILLER TEST","--------------------",`Venditore: ${userName}`,
    `Email: ${userMail}`,`Telefono: ${userTel}`,
    `Profilo dominante: ${COLORS[dom.k].name} (${COLORS[dom.k].tag})`,
    `Mix: ${rk.map(r=>`${COLORS[r.k].name} ${r.p}%`).join(' | ')}`,"",
    "RISPOSTE DATE","--------------------"];
  shuffled.forEach((q,i)=>{
    const opt=scelta(i);
    const c=codice(i);
    L.push(`${i+1}. ${q.q}`);
    L.push(c&&opt?`   -> ${COLORS[c]?`[${COLORS[c].name}] `:""}${opt.t}`:`   -> (nessuna risposta)`);
  });
  L.push("","REPORT","--------------------","",
    "STILE COMUNICATIVO ATTUALE",R.stile,"",
    "GUIDA PER IL SALES MANAGER",R.manager,"",
    "PIANO D'AZIONE FORMATIVO",R.piano);
  return L.join("\n");
}

function showErr(){const e=document.getElementById('err'); if(e) e.style.display='block';}
next.onclick=()=>{
  if(step>=QUESTIONS.length) return;              // sulla schermata finale il tasto non fa nulla
  if(step===-1){
    const f=document.getElementById('uname'), m=document.getElementById('umail'), t=document.getElementById('utel');
    userName=f?f.value.trim():'';
    userMail=m?m.value.trim():'';
    userTel=t?t.value.trim():'';
    // controlli minimi: una chiocciola con un punto dopo, e almeno 8 cifre
    const mailOk=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(userMail);
    const telOk=(userTel.match(/\d/g)||[]).length>=8;
    const c=document.getElementById('ucons');
    consenso=c?c.checked:false;
    const consOk=!DA_PUBBLICITA||consenso;
    if(!userName||!mailOk||!telOk||!consOk){
      const e=document.getElementById('err');
      if(e) e.textContent=!userName?'Scrivi il tuo nome per iniziare.':(!mailOk?'Controlla l\'email: serve per il riscontro.':(!telOk?'Scrivi un numero di telefono valido.':'Spunta il consenso per iniziare.'));
      showErr();return}
    caricaPixel();
    step=0;render();return}
  if(answers[step]==null){showErr();return}
  step++;render();
};
back.onclick=()=>{
  if(inviato) return;                              // dopo l'invio non si torna indietro
  if(step>-1){step--;render()}
};
render();
</script>
</body>
</html>
